[project]
name = "robot"
version = "0.1.0"
description = "YAM-Robot imitation learning pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mink>=1.3.0",
    "mjviser>=0.0.14",
    "mujoco==3.12",
    "numpy>=2.5.2",
    "pillow>=12.0.0",
    "pyrealsense2>=2.58.4; sys_platform == 'linux'",
    "pynput>=1.8.2",
    "pyspacemouse>=2.1.0",
    "viser>=1.0.30",
    "rust-just>=1.58.0",
    "torch==2.11.0",
    "torchcodec==0.11.0",
    "h5py>=3.16.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pybind11-stubgen>=2.5.5",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "ruff>=0.16.5",
    "abc-minimal",
]

[tool.uv]
override-dependencies = [
    "mujoco==3.12",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.basedpyright]
extraPaths = ["src"]
typeCheckingMode = "off"
reportUnknownMemberType = "none"

[tool.ty]
environment.extra-paths = ["typings"]

[tool.ruff]
lint.extend-select = ["C901"]
lint.mccabe.max-complexity = 8

[tool.uv.sources]
abc-minimal = { git = "https://github.com/amazon-far/abc.git" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
