[project]
name = "robot"
version = "0.1.0"
description = "YAM-Robot imitation learning pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mink>=1.3.0",
    "mjviser>=0.0.14",
    "mujoco>=3.11.0",
    "numpy>=2.5.2",
    "viser>=1.0.30",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pybind11-stubgen>=2.5.5",
    "ipykernel>=7.3.0",
    "rust-just>=1.58.0",
]


[tool.basedpyright]
reportUnknownMemberType = "none"
