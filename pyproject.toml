[project]
name = "robot"
version = "0.1.0"
description = "YAM-Robot imitation learning pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evdev>=2.0.0; sys_platform == 'linux'",
    "mink>=1.3.0",
    "mjviser>=0.0.14",
    "mujoco==3.12",
    "numpy>=2.5.2",
    "pynput>=1.8.2",
    "pyspacemouse>=2.1.0",
    "viser>=1.0.30",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pybind11-stubgen>=2.5.5",
    "ipykernel>=7.3.0",
    "rust-just>=1.58.0",
    "matplotlib>=3.11.1",
    "ruff>=0.16.5",
]


[tool.basedpyright]
reportUnknownMemberType = "none"

[tool.ty.environment]
extra-paths = ["typings"]
